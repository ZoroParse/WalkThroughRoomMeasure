align-items:center;gap:8px;transition:background .12s ease,border-color .12s ease,transform .05s ease;user-select:none}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}button.primary{background:var(--cyan-deep);border-color:var(--cyan);color:#eafaff;font-weight:600}button.go{background:var(--go-deep);border-color:var(--go);color:#eafff5;font-weight:700}button.ghost{background:transparent}button:disabled{opacity:.4;cursor:not-allowed}.segmented{display:inline-flex;background:var(--ink-700);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.segmented button{min-height:38px;padding:0 12px;border:1px solid transparent;background:transparent;border-radius:9px;font-size:.85rem;white-space:nowrap}.segmented button[aria-pressed=true]{background:var(--ink-600);border-color:var(--line)}.segmented button .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;gap:12px}#hud>*{pointer-events:auto}.card{background:#0f1722eb;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;backdrop-filter:blur(8px);box-shadow:0 12px 30px #0006}.measure-card{display:flex;flex-direction:column;gap:12px}.measure-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.measure-kind{display:inline-flex;align-items:center;gap:8px;font-weight:650}.measure-kind .swatch{width:14px;height:14px;border-radius:4px}.measure-progress{color:var(--fg-dim);font-size:.8rem;font-variant-numeric:tabular-nums}.measure-input-row{display:flex;gap:10px;align-items:stretch}.measure-input-row input{flex:1;font:inherit;font-size:1.4rem;font-variant-numeric:tabular-nums;text-align:right;color:var(--fg);background:var(--ink-700);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}.measure-input-row input:focus{outline:2px solid var(--cyan);outline-offset:1px}.measure-unit{display:inline-flex;align-items:center;color:var(--fg-dim);font-weight:600}.measure-nav{display:flex;gap:10px}.measure-nav button{flex:1}.bar{height:6px;border-radius:99px;background:var(--ink-700);overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--go));transition:width .3s ease}.overlay-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:auto}.panel{max-width:440px;width:100%;text-align:center}.panel h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}.panel p{color:var(--fg-dim);margin:0 0 18px;line-height:1.5}.panel .actions{display:flex;flex-direction:column;gap:10px}.hint{font-size:.82rem;color:var(--fg-dim);line-height:1.4}.toast{align-self:center;background:var(--ink-600);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:.85rem;box-shadow:0 8px 20px #0006}@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}</style>

  <body>
    <div id="app">

      <header id="topbar">
        <div id="phase-title">Room Walkthrough</div>
        <div id="topbar-actions"></div>

      <!-- Stage holds whichever surface the current phase needs -->
      <main id="stage">
        <!-- 2D tracing canvas (upload + trace phases) -->
        <canvas id="trace-canvas"></canvas>
        <!-- 3D scene canvas (walkthrough + rescale phases) -->
        <canvas id="scene-canvas"></canvas>
        <!-- Floating HUD / prompts, overlaying only the stage -->
        <div id="hud"></div>
      </main>

      <!-- Bottom toolbar: phase-specific controls -->
      <footer id="toolbar"></footer>
    </div>
