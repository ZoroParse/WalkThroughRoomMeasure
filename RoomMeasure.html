      <main id="stage">

        <!-- 3D scene canvas (walkthrough + rescale phases) -->
        <canvas id="scene-canvas"></canvas>
        <!-- Floating HUD / prompts, overlaying only the stage -->
        <div id="hud"></div>
      </main>

      <!-- Bottom toolbar: phase-specific controls -->
      <footer id="toolbar"></footer>
    </div>
